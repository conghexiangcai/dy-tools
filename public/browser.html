<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>抖音窗口</title><style>body{margin:0;font:14px 'Microsoft YaHei',sans-serif;background:#f3f5f0;color:#243731}.bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px}button{border:1px solid #cbd6c8;border-radius:6px;background:white;padding:6px 10px;cursor:pointer}button:disabled{opacity:.5}.note{font-size:12px;flex:1}.tabs{height:42px;display:flex;gap:4px;overflow-x:auto;padding:0 10px}.tab{display:flex;flex:0 0 220px;min-width:100px;max-width:220px;height:34px;border:1px solid #cbd6c8;border-radius:6px;background:white}.tab .select{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:inherit;text-align:left}.tab .close{flex:0 0 30px;margin:0;padding:0;border:0;background:transparent;color:inherit;font-size:22px}.tab .close:hover{background:#ceddd4}.empty{padding:30px;color:#61746a}.tab.active{background:#205d4c;color:white}.close{margin-left:8px}</style></head><body><div class="bar"><button id="back">返回关注清单</button><span id="note" class="note">在此登录抖音。登录后返回关注清单，点击“连接检查”。</span><button id="verified" hidden>已完成验证，等待 5 秒继续</button></div><div class="tabs" id="tabs"></div><div class="empty">选择或打开主页后在此显示。每个标签右侧 × 可关闭页面，关闭窗口会停止全部播放。</div><script src="browser.js"></script></body></html>
