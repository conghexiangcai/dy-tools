<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>作品下载 · 抖音整理箱</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="download.css"></head><body>
<header><div><div class="eyebrow">DOUYIN / TOOLBOX</div><h1>作品下载</h1><p>粘贴分享链接，把视频和图集保存到电脑</p></div><div class="actions"><button id="home">返回工具箱</button><button id="login">登录抖音</button><button id="connect">连接当前账号</button></div></header>
<main class="download-main"><div id="error" role="alert" class="error" hidden></div>
<section class="download-panel"><label for="input"><h2>分享链接</h2></label><textarea id="input" placeholder="粘贴一条或多条完整分享文案、作品链接；不同链接可分行填写" maxlength="100000"></textarea><div class="actions"><button id="parse" class="primary">解析作品</button><button id="pause" disabled>暂停</button><button id="resume" disabled>继续</button><button id="verified" hidden>已完成验证</button><span id="status" role="status">等待输入链接</span></div><p class="muted">视频优先无水印最高可用画质；无法确认水印状态时会标明。图集按原顺序保存，不拼接或转码。</p><div id="parse-errors"></div></section>
<section class="download-panel"><div class="section-head"><div><h2>选择作品 <span id="work-count" class="count">0</span></h2><p class="muted">下载前核对作者、作品和所选版本。</p></div><div class="actions"><button id="select-all">全选作品</button><button id="select-none">取消全选</button></div></div><div id="works" class="work-grid"></div><p id="empty" class="muted">解析成功的作品会显示在这里。</p>
<div class="save-bar"><div><small>保存位置</small><div id="directory"></div></div><button id="choose-directory">更改目录</button><button id="start" class="primary" disabled>下载所选作品</button></div></section>
<section class="download-panel"><div class="section-head"><h2>下载队列</h2><div class="actions"><select id="history" aria-label="选择下载任务"><option value="">选择历史任务</option></select><button id="retry" disabled>重试失败项</button></div></div><p id="run-status" role="status">尚无下载任务</p><progress id="progress" value="0" max="1"></progress><span id="bytes"></span><div class="download-table"><table><thead><tr><th>作品</th><th>文件 / 版本</th><th>状态</th><th>大小</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script src="download.js"></script><script src="session-status.js"></script></body></html>
