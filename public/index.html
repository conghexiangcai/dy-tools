<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"><title>抖音关注清单</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><div class="eyebrow">DOUYIN / FOLLOWING REVIEW</div><h1>关注清单 <span class="tag">手动查看</span></h1><p>筛选 · 勾选 · 分批打开主页，在抖音里决定是否取关</p></div><div class="summary"><div class="metric"><b id="total">—</b><span>名单账号</span></div><div class="metric"><b id="match-count">—</b><span>符合筛选</span></div><div class="metric"><b id="selected-count">0</b><span>已勾选</span></div></div></header><section class="appbar"><button id="fan-open">粉丝团查询</button><button id="login">登录抖音</button><button id="connect">连接检查</button><button id="refresh" class="primary">更新数据</button><button id="pause">暂停</button><button id="resume">继续</button><button id="verified" hidden>已完成验证</button><span class="spacer"></span><button id="import-review">导入使用记录</button><button id="export-review">导出使用记录</button><select id="export-format" aria-label="导出格式"><option value="html">HTML</option><option value="json">JSON</option><option value="md">Markdown</option></select><button id="export">导出名单</button><div class="status"><progress id="progress" value="0" max="1"></progress> <span id="task-status">正在读取本地数据…</span></div><div id="group-status" class="group-status"></div><div id="app-error" class="error" role="alert" hidden></div></section>
<main class="layout"><aside class="sidebar"><h2>筛选条件</h2><div class="fields">
<label class="field"><span>粉丝数低于</span><input id="fans" type="number" min="0" step="1" value="10000" placeholder="不限"><small>严格小于，留空表示不限</small></label>
<label class="field"><span>粉丝数大于</span><input id="fans-min" type="number" min="0" step="1" value="" placeholder="不限"><small>严格大于，留空表示不限；未知数不按 0 计算</small></label>
<label class="field"><span>作品数少于</span><input id="works-limit" type="number" min="0" step="1" value="20" placeholder="不限"><small>未知数量不会按 0 计算</small></label>
<label class="field"><span>作品数大于</span><input id="works-min" type="number" min="0" step="1" value="" placeholder="不限"><small>严格大于，留空表示不限；未知数不按 0 计算</small></label>
<label class="field"><span>最新发布距今大于（天）</span><input id="days-min" type="number" min="0" step="1" placeholder="不限"><small>按北京时间自然日计算，严格大于</small></label><label class="field"><span>最新发布距今小于（天）</span><input id="days-max" type="number" min="0" step="1" placeholder="不限"><small>时间范围单独生效；留空不限，未知不参与时间筛选</small></label><label class="field"><span>条件组合</span><select id="logic"><option value="or">满足任意条件（或）</option><option value="and">满足全部条件（且）</option></select><small>已填阈值均参与组合；同时限定上下限时请选择“且”</small></label>
<label class="field"><span>是否互相关注</span><select id="mutual"><option value="">全部关注关系</option><option value="yes">互相关注</option><option value="no">未互相关注</option><option value="unknown">关系未知</option></select></label>
<label class="field"><span>筛选结果</span><select id="decision"><option value="match">符合条件</option><option value="pending">待确认（数据未知）</option><option value="excluded">不符合条件</option><option value="">全部结果</option></select></label>
<label class="field"><span>作品数据</span><select id="works-state"><option value="">全部作品数状态</option><option value="known">作品数已核实</option><option value="unknown">作品数未知</option></select></label></div>
<label class="checkfield"><input id="following-greater" type="checkbox">同时启用“关注数大于粉丝数”</label><div class="hint" id="rule"></div><hr><button class="reset" id="reset">恢复默认筛选</button><p class="small" id="storage-info">勾选与打开进度保存在本机，按抖音账号分别保存。</p></aside>
<section class="content"><div class="notice" id="data-status"></div><div class="toolbar"><input class="search" id="search" aria-label="搜索昵称或抖音号" placeholder="搜索昵称或抖音号…"><select id="group-filter" aria-label="所属分组"><option value="">所属分组：全部</option><option value="ungrouped">未分组</option><option value="unknown">归属未知</option></select><select id="opened-state" aria-label="是否打开"><option value="">是否打开：全部</option><option value="unopened">未打开</option><option value="opened">已打开</option></select><select id="sort" aria-label="排序"><option value="recency_asc">最新发布：距今从近到远</option><option value="recency_desc">最新发布：距今从远到近</option><option value="difference_desc">关注 − 粉丝：从高到低</option><option value="difference_asc">关注 − 粉丝：从低到高</option><option value="fans_asc">粉丝数：从低到高</option><option value="fans_desc">粉丝数：从高到低</option><option value="works_asc">作品数：从少到多</option><option value="works_desc">作品数：从多到少</option><option value="following_desc">关注数：从高到低</option><option value="following_asc">关注数：从低到高</option></select></div>
<div class="selection"><strong id="selection-info">已勾选 0 人</strong><button id="select-page">勾选当前页</button><button id="unselect-page">取消当前页</button><button id="clear-selection">清空勾选</button><label>每批 <select id="batch-size" aria-label="每批打开数量"><option>1</option><option selected>5</option><option>10</option></select> 人</label><button class="primary" id="open-next">打开下一批 ↗</button><button id="reopen">重开上一批</button><div class="sub" id="batch-info"></div></div>
<div class="error" id="filter-error" role="alert" hidden></div><section class="batch" id="batch-panel" hidden><h3>本批主页</h3><div id="batch-message" aria-live="polite"></div><ul id="batch-links"></ul><p>若浏览器拦截了新标签页，可在此逐个打开。只有成功提交打开的账号会从“下一批”中移除。</p></section>
<div class="table-wrap"><table><thead><tr><th><input id="check-page" type="checkbox" aria-label="全选或取消当前页"></th><th>账号</th><th>粉丝数</th><th>关注数</th><th>关注 − 粉丝</th><th>作品数</th><th>互关</th><th>所属分组<button id="refresh-groups" class="group-refresh" title="只刷新分组，不重采账号详情">刷新</button></th><th>命中条件</th><th>最新三条视频发布时间</th><th>打开记录</th><th>主页</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><span id="page-info" class="small" aria-live="polite"></span><div><button id="prev">上一页</button><button id="next">下一页</button></div></div><div class="footer" id="footer"></div></section></main>
<script src="rules.js"></script><script src="renderer.js"></script></body></html>
