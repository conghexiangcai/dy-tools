<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'"><title>粉丝团查询 · 抖音工具箱</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fanclub.css"></head><body>
<header><div><div class="eyebrow">DOUYIN / TOOLBOX</div><h1>粉丝团查询 <span class="tag">指定主播</span></h1><p>维护主播名单，查看目标用户的灯牌与会员信息</p></div><div><button id="login">登录抖音</button> <button id="connect">连接当前账号</button><p id="owner" class="small"></p></div></header>
<div id="error" class="error alert" role="alert" hidden></div>
<main class="fan-layout"><aside class="fan-panel"><h2>主播名单 <span id="anchor-count" class="tag">0</span></h2><p class="small">只查询你添加的主播。删除名单条目不会取消抖音关注。</p><form id="add-form"><label for="anchor-input">主页分享链接 / sec_uid / 内部 UID</label><textarea id="anchor-input" rows="3" placeholder="粘贴主播主页分享文本"></textarea><button id="add" type="submit">添加主播</button></form><div class="anchor-tools"><button id="all">全选</button><button id="none">全不选</button></div><div id="anchors"></div></aside>
<section class="fan-content"><section class="fan-panel"><h2>查询用户</h2><form id="resolve-form"><label for="target-input">主页分享链接 / sec_uid / 内部 UID</label><div class="query-input"><textarea id="target-input" rows="2" placeholder="数字输入按内部 UID 处理，不是主页显示的抖音号"></textarea><button id="resolve" type="submit">识别账号</button></div></form><p class="small">识别后核对昵称和主页，再开始查询。第一版不支持直接搜索抖音号。</p><div id="target" class="target" hidden></div></section>
<section class="fan-panel"><div class="fan-actions"><button id="start" class="primary">查询勾选主播</button><button id="pause">暂停</button><button id="resume">继续</button><button id="retry">重试失败项</button><button id="verified" hidden>已完成验证</button><span class="spacer"></span><select id="format" aria-label="导出格式"><option value="html">HTML</option><option value="json">JSON</option><option value="md">Markdown</option></select><button id="export">导出结果</button></div><div class="progress-line"><progress id="progress" max="1" value="0"></progress><span id="status" aria-live="polite">添加主播并识别账号后即可查询</span></div></section>
<section id="result-panel" class="fan-panel" hidden><div id="result-user" class="result-user"></div><p class="notice">仅覆盖本次主播名单，不代表该用户加入的全部粉丝团。钻石区间按荣誉等级估算，不是实际消费账单。</p><p class="small">会员／守护仍缺少正样本核验，当前显示“未知”；未知灯牌不代表未加入。</p><input id="search" class="result-search" placeholder="搜索本次结果的主播或备注" aria-label="搜索结果"><div class="table-wrap"><table><thead><tr><th>主播</th><th>灯牌等级</th><th>灯牌状态</th><th>粉丝团名称</th><th>会员／守护</th><th>到期时间</th><th>查询时间 / 说明</th><th>主页</th></tr></thead><tbody id="results"></tbody></table></div></section>
</section></main><script src="fanclub.js"></script></body></html>
