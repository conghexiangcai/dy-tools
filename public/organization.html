<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"><title>抖音整理箱</title><link rel="stylesheet" href="toolbox.css"><link rel="stylesheet" href="organization.css"></head><body>
<header><div><small>DOUYIN / TOOLBOX</small><h1 id="title"></h1><p id="subtitle"></p></div><div class="account"><div class="controls"><button id="home">工具箱</button><button id="login">登录抖音</button><button id="connect">连接当前账号</button></div><p id="owner"></p></div></header>
<main><p id="error" hidden></p><section><div class="controls" id="top-actions"></div><p id="progress" class="muted"></p></section>
<div id="groups-panel" hidden class="group-layout"><section class="side"><h2>抖音关注分组</h2><p id="group-time" class="muted"></p><div class="controls"><button disabled title="线上写入尚未验证">新建</button><button disabled title="线上写入尚未验证">改名</button><button disabled title="线上写入尚未验证">删除</button></div><p id="capability" class="notice"></p><div id="group-list"></div></section><div>
<section><div class="heading"><h2 id="members-title">成员</h2><span id="selection-count"></span></div><div class="controls"><input id="member-search" placeholder="搜索昵称、抖音号或 UID"><button id="select-page">勾选当前页</button><button id="select-filtered">勾选全部筛选结果</button><button id="clear-selection">清空勾选</button></div><div id="stage-note" class="notice" hidden></div>
<div class="controls actions"><label>操作 <select id="operation"><option value="add">加入分组</option><option value="copy">复制到其他组</option><option value="move">移动到其他组</option><option value="remove">移出当前组</option></select></label><div id="destinations"></div><button id="preview" class="primary">生成分组操作预览</button></div>
<div class="controls"><button id="ignore">忽视所选成员</button><button id="unfollow">预览取关所选成员</button><select id="member-format"><option value="xlsx">Excel</option><option value="json">JSON</option></select><button id="export-members">导出所选成员</button></div>
<div class="table-wrap"><table><thead><tr><th>选择</th><th>账号</th><th>所属分组</th><th>主页</th></tr></thead><tbody id="member-rows"></tbody></table></div><div class="controls pages"><button id="member-prev">上一页</button><span id="member-page"></span><button id="member-next">下一页</button></div></section>
<section><h2>分组操作记录</h2><select id="batch-list"></select><div id="batch-preview" hidden><p id="batch-scope"></p><p id="batch-message"></p><div class="controls"><button id="execute" class="primary">核对名单并确认执行</button><button id="batch-pause">暂停</button><button id="batch-verified" hidden>已完成验证，等待 5 秒继续</button></div><div class="table-wrap"><table><thead><tr><th>账号 / UID</th><th>状态</th><th>回读结果</th></tr></thead><tbody id="batch-rows"></tbody></table></div></div></section></div></div>
<div id="changes-panel" hidden><section id="chat-selector" hidden><h2>选择需要扫描的群</h2><div id="chat-list" class="chat-list"></div><p class="muted">只扫描勾选的群。导入文件请使用“群成员检索”，导入版本仅参与手动历史比较。</p><button id="chat-import">打开群成员检索 / 导入</button></section>
<section><div class="controls"><label id="kind-label">名单 <select id="kind"><option value="following">我的关注</option><option value="followers">我的粉丝</option></select></label><label id="scope-label" hidden>群 <select id="scope"></select></label><label>后次采集从 <input id="date-from" type="date"></label><label>至 <input id="date-to" type="date"></label></div><p id="read-capability" class="notice"></p><h2>变化记录</h2><select id="change-list"></select><p id="baseline" class="muted"></p>
<details><summary>选择两个历史版本比较</summary><div class="controls actions"><label>前一版本 <select id="before"></select></label><label>后一版本 <select id="after"></select></label><button id="compare">比较所选版本</button></div><p class="muted">同一账号、同一名单或同一群；不完整版本不能确认成员减少。</p></details></section>
<section><div class="heading"><h2>变化结果</h2><span id="change-count"></span></div><p id="comparison-scope" class="muted"></p><div class="controls"><select id="category"><option value="">全部变化</option><option value="added">新增</option><option value="removed">减少</option><option value="renamed">资料变化</option></select><input id="change-search" placeholder="搜索昵称、账号、UID 或群昵称"><select id="change-format"><option value="xlsx">Excel</option><option value="json">JSON</option></select><button id="export-changes">导出本次完整比较</button></div><div class="table-wrap"><table><thead><tr><th>变化</th><th>账号 / UID</th><th>原资料</th><th>新资料</th><th>说明</th><th>主页</th></tr></thead><tbody id="change-rows"></tbody></table></div><div class="controls pages"><button id="change-prev">上一页</button><span id="change-page"></span><button id="change-next">下一页</button></div></section></div>
</main><footer>所有时间为本地显示时间。变化发生在两次采集之间，不代表准确发生时刻或减少原因。</footer><script src="organization.js"></script></body></html>
