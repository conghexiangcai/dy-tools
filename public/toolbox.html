<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"><title>抖音整理箱</title><link rel="stylesheet" href="toolbox.css"></head><body>
<header><div><small>DOUYIN / TOOLBOX</small><h1 id="title">抖音整理箱</h1><p id="subtitle">整理关注与互动记录，按需要打开一项工具。</p></div><div class="account"><button id="home">返回工具箱</button><button id="login">登录抖音</button><button id="connect">连接当前账号</button><p id="owner">尚未连接账号</p></div></header>
<main><p id="error" role="alert" hidden></p><div id="cards" class="cards" hidden></div>
<section id="module" hidden><p id="intro"></p><div id="module-actions" class="controls"></div><p id="info" class="muted"></p><div id="contents"></div></section>
<section id="preview" hidden><div class="heading"><h2 id="preview-title">操作预览</h2><div class="controls"><button id="run-export">导出执行记录</button><button id="stop">暂停</button><button id="execute" class="danger">确认并执行</button><button id="verified" hidden>已完成验证，等待 5 秒后继续</button></div></div><p id="scope"></p><p id="run-message" class="notice"></p><progress id="run-progress" max="1" value="0"></progress><p id="run-count"></p><input id="run-search" placeholder="搜索预览中的账号或作品…" aria-label="搜索预览"><div class="table-wrap"><table><thead><tr><th>账号 / 作品</th><th>ID</th><th>状态</th><th>说明</th></tr></thead><tbody id="run-items"></tbody></table></div><p id="run-page" class="muted"></p><button id="run-prev">上一页</button><button id="run-next">下一页</button></section>
</main><footer>数据保存在本机并按账号隔离。选择工具、读取名单或生成预览不会执行取关或清理。</footer><script src="toolbox.js"></script></body></html>
